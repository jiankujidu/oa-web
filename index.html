<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>优品OA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot-splash"><div class="boot-logo">优品OA</div><div class="boot-tip">加载中…</div></div>

<div id="app-view" class="app-view" style="display:none">
  <!-- 顶部 -->
  <div class="topbar">
    <div class="topbar-title" id="top-title">优品OA</div>
    <div class="topbar-right">
      <div class="bell-btn" id="bell" title="消息">🔔<span class="bell-badge" id="bell-badge" style="display:none">0</span></div>
      <div class="topbar-btn" id="logout-btn">退出</div>
    </div>
  </div>
  <!-- 内容 -->
  <div class="page-container" id="page-container"><div class="loading">加载中…</div></div>
  <!-- 底部 tabbar -->
  <div class="tabbar" id="tabbar">
    <div class="tab-item active" data-tab="home" onclick="App.switchTab('home')"><div class="tab-icon">🏠</div><div>首页</div></div>
    <div class="tab-item" data-tab="approve" onclick="App.switchTab('approve')"><div class="tab-icon">✅</div><div>审批</div></div>
    <div class="tab-item" data-tab="customer" onclick="App.switchTab('customer')"><div class="tab-icon">👥</div><div>客户</div></div>
    <div class="tab-item" data-tab="mine" onclick="App.switchTab('mine')"><div class="tab-icon">👤</div><div>我的</div></div>
  </div>
</div>

<script src="lib/oa.js"></script>
<script src="app.js"></script>
<script>
window.addEventListener('load', function(){
  if (OA.isLoggedIn()) { document.getElementById('app-view').style.display='flex'; App.init(); }
  else { location.replace('login.html'); }
  document.getElementById('boot-splash').style.display='none';
});
</script>
</body>
</html>
