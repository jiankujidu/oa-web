<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>优品OA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot-splash"><div class="boot-logo">优品OA</div><div class="boot-tip">加载中…</div></div>

<div id="app-view" class="app-view" style="display:none">
  <!-- 顶部 -->
  <div class="topbar">
    <div class="topbar-title" id="top-title">优品OA</div>
    <div class="topbar-right">
      <div class="bell-btn" id="bell" title="消息">🔔<span class="bell-badge" id="bell-badge" style="display:none">0</span></div>
      <div class="topbar-btn" id="logout-btn">退出</div>
    </div>
  </div>
  <!-- 内容 -->
  <div class="page-container" id="page-container"><div class="loading">加载中…</div></div>
  <!-- 底部 tabbar -->
  <div class="tabbar" id="tabbar">
    <div class="tab-item active" data-tab="home" onclick="App.switchTab('home')"><div class="tab-icon">🏠</div><div>首页</div></div>
    <div class="tab-item" data-tab="approve" onclick="App.switchTab('approve')"><div class="tab-icon">✅</div><div>审批</div></div>
    <div class="tab-item" data-tab="customer" onclick="App.switchTab('customer')"><div class="tab-icon">👥</div><div>客户</div></div>
    <div class="tab-item" data-tab="mine" onclick="App.switchTab('mine')"><div class="tab-icon">👤</div><div>我的</div></div>
  </div>
</div>

<script src="lib/oa.js"></script>
<script src="lib/approve_meta.js"></script>
<script src="app.js"></script>
<script>
/* 启动逻辑：CSS/JS 已由构建内联进本页，DOM 解析到这里即可直接执行，不等待 window.load。
 * try/catch + 3.5s 看门狗双兜底，任何异常都不会卡死在启动屏。 */
(function () {
  var sp = document.getElementById('boot-splash');
  function hideSplash() { if (sp) sp.style.display = 'none'; }
  function boot() {
    try {
      if (OA.isLoggedIn()) {
        document.getElementById('app-view').style.display = 'flex';
        App.init();
        hideSplash();
      } else {
        location.replace('login.html');
      }
    } catch (e) {
      // 启动异常：清登录态回登录页，绝不留在启动屏
      try { localStorage.removeItem('uping_user'); localStorage.removeItem('uping_me'); } catch (_e) {}
      location.replace('login.html');
    }
  }
  // 看门狗：3.5s 后若启动屏仍在（脚本异常/极端情况），强制恢复
  setTimeout(function () {
    if (!sp || sp.style.display === 'none') return;
    var logged = false;
    try { logged = localStorage.getItem('uping_user') === '1'; } catch (e) {}
    if (!logged) { location.replace('login.html'); return; }
    hideSplash();
    var av = document.getElementById('app-view');
    if (av && av.style.display === 'none') {
      av.style.display = 'flex';
      try { App.init(); } catch (e) {}
    }
  }, 3500);
  boot();
})();
</script>
</body>
</html>
