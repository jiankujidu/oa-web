<!DOCTYPE html>
<html lang="zh-CN" data-device="desktop">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1E6FFF">
<title>优品OA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot-splash"><div class="boot-logo">优品OA</div><div class="boot-tip">正在加载…</div></div>

<div id="login-view" class="login-view" style="display:none"></div>

<!-- 应用根：桌面壳与手机壳静态共存，由 html[data-device] 在 CSS 中严格分作用域，视觉上绝不混合 -->
<div id="app-view" class="app-view" style="display:none">

  <!-- ============ 桌面壳 ============ -->
  <aside class="sidebar">
    <div class="sb-brand"><span class="sb-logo">优</span><span class="sb-name">优品OA<small>YOUPIN OA</small></span></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="sb-user" title="进入个人中心" onclick="App.switchTab('mine')">
        <div class="sb-user-ava" id="sb-user-ava">U</div>
        <div class="sb-user-meta">
          <div class="sb-user-name" id="sb-user-name">用户</div>
          <div class="sb-user-sub">个人中心</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="main-col">
    <div class="topbar">
      <div class="topbar-left" id="topbar-left">
        <div class="topbar-crumb" id="topbar-crumb" style="display:none">
          <span class="crumb-link" id="crumb-1">工作台</span>
          <span class="crumb-sep" data-icon="chevron-right"></span>
        </div>
        <div class="topbar-title" id="topbar-title">优品OA</div>
      </div>
      <div class="topbar-right">
        <div class="search-trigger" id="search-trigger" title="搜索模块与功能（Ctrl+K）">
          <span data-icon="search"></span>
          <span class="st-text">搜索模块、功能…</span>
          <kbd>Ctrl K</kbd>
        </div>
        <div class="bell-btn" id="bell" title="消息中心" onclick="App.showSubPage('message-inbox')"><span data-icon="bell"></span><span class="bell-badge" id="bell-badge" style="display:none">0</span></div>
        <div class="topbar-user" id="topbar-user">
          <div class="topbar-user-ava" id="topbar-user-ava">U</div>
          <span class="topbar-user-name" id="topbar-user-name">用户</span>
          <span class="topbar-caret" data-icon="chevron-down"></span>
        </div>
      </div>
    </div>
    <div class="user-menu" id="user-menu">
      <div class="user-menu-item" onclick="App.showSubPage('profile')"><span class="umi-ic" data-icon="user-circle"></span>基本资料</div>
      <div class="user-menu-item" onclick="App.showSubPage('password')"><span class="umi-ic" data-icon="lock"></span>修改密码</div>
      <div class="user-menu-item" onclick="App.switchTab('mine')"><span class="umi-ic" data-icon="layout"></span>个人中心</div>
      <div class="user-menu-sep"></div>
      <div class="user-menu-item danger" onclick="App.logout()"><span class="umi-ic" data-icon="log-out"></span>退出登录</div>
    </div>
    <div class="cmdk-mask" id="cmdk-mask">
      <div class="cmdk" role="dialog" aria-label="命令面板">
        <div class="cmdk-input-row">
          <span data-icon="search"></span>
          <input id="cmdk-input" type="text" placeholder="搜索模块、功能、页面…" autocomplete="off">
          <kbd>ESC</kbd>
        </div>
        <div class="cmdk-list" id="cmdk-list"></div>
        <div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div>
      </div>
    </div>
    <div class="page-container" id="page-container"><div class="loading">加载中…</div></div>
  </div>

  <!-- ============ 手机壳 ============ -->
  <header class="m-appbar">
    <button class="m-back" id="m-back" hidden data-icon="chevron-left"></button>
    <div class="topbar-title m-title" id="m-title">优品OA</div>
    <div class="m-appbar-actions">
      <button class="m-icon-btn" id="m-search" title="搜索" data-icon="search"></button>
      <button class="m-icon-btn" id="m-bell" title="消息" data-icon="bell"><span class="m-bell-badge" id="m-bell-badge" style="display:none">0</span></button>
    </div>
  </header>
  <div class="m-search-sheet" id="m-search-sheet">
    <div class="m-ss-head">
      <input class="m-ss-input" id="m-ss-input" type="text" placeholder="搜索模块、功能…" autocomplete="off">
      <button class="m-ss-cancel" id="m-ss-cancel">取消</button>
    </div>
    <div class="m-ss-list" id="m-ss-list"></div>
  </div>
  <nav class="m-tabbar" id="m-tabbar">
    <button class="m-tab active" data-tab="home"><span class="m-tab-ico" data-icon="home"></span>首页</button>
    <button class="m-tab" data-tab="approve"><span class="m-tab-ico" data-icon="check-circle"></span>审批</button>
    <button class="m-tab" data-tab="customer"><span class="m-tab-ico" data-icon="users"></span>客户</button>
    <button class="m-tab" data-tab="message-inbox"><span class="m-tab-ico" data-icon="mail"></span>消息</button>
    <button class="m-tab" data-tab="mine"><span class="m-tab-ico" data-icon="user"></span>我的</button>
  </nav>
</div>

<script src="lib/oa.js"></script>
<script src="lib/approve_meta.js"></script>
<script src="app.js"></script>
<script src="doc.js"></script>

  window.ICONS = ICONS;
  function svg(name, cls) {
    var d = ICONS[name];
    if (!d) return '';
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  window.OA_ICON = svg;
  function paintIcons(root) {
    root = root || document;
    var els = root.querySelectorAll('[data-icon]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var name = el.getAttribute('data-icon');
      if (el.getAttribute('data-painted') === '1') continue;
      var s = svg(name);
      if (s) { el.innerHTML = s; el.setAttribute('data-painted', '1'); }
    }
  }
  window.OA_PAINT = paintIcons;

  var MODULES = [
    { g: '主菜单', n: '工作台', i: 'home', run: function () { App.switchTab('home'); } },
    { g: '主菜单', n: '审批中心', i: 'check-circle', run: function () { App.switchTab('approve'); } },
    { g: '主菜单', n: '客户管理', i: 'users', run: function () { App.switchTab('customer'); } },
    { g: '主菜单', n: '个人中心', i: 'user', run: function () { App.switchTab('mine'); } },
    { g: '办公', n: '消息中心', i: 'mail', run: function () { App.showSubPage('message-inbox'); } },
    { g: '办公', n: '通讯录', i: 'book', run: function () { App.showSubPage('mail'); } },
    { g: '办公', n: '企业公告', i: 'megaphone', run: function () { App.showSubPage('note'); } },
    { g: '办公', n: '问答知识', i: 'message-circle', run: function () { App.showSubPage('article'); } },
    { g: '办公', n: '产品管理', i: 'flask', run: function () { App.showSubPage('product'); } },
    { g: '办公', n: '附件管理', i: 'folder', run: function () { App.showSubPage('files'); } },
    { g: '办公', n: '工作台', i: 'layers', run: function () { App.openWorkbench(); } },
    { g: '办公', n: 'AI 问答', i: 'bot', run: function () { App.openAiChat(); } },
    { g: '财务', n: '预存款', i: 'wallet', run: function () { App.showSubPage('finance-advance'); } },
    { g: '财务', n: '抵扣券（我申请的）', i: 'ticket', run: function () { App.showSubPage('deduction'); } },
    { g: '财务', n: '抵扣券（管理专用）', i: 'ticket', run: function () { App.showSubPage('deduction-checked'); } },
    { g: '财务', n: '保证金', i: 'shield', run: function () { App.showSubPage('margin'); } },
    { g: '财务', n: '发票（我申请的）', i: 'receipt', run: function () { App.showSubPage('invoice-my'); } },
    { g: '财务', n: '发票（我处理的）', i: 'archive', run: function () { App.showSubPage('invoice-handle'); } },
    { g: '财务', n: '到账（发票）', i: 'file-text', run: function () { App.showSubPage('finance-income'); } },
    { g: '财务', n: '到账（订单）', i: 'trending-up', run: function () { App.showSubPage('finance-order'); } },
    { g: '财务', n: '订单到账处理', i: 'settings', run: function () { App.showSubPage('orderapply-handle'); } },
    { g: '客户与业务', n: '客户联系人', i: 'user-plus', run: function () { App.showSubPage('contact-list'); } },
    { g: '客户与业务', n: '销售机会', i: 'target', run: function () { App.showSubPage('chance-list'); } },
    { g: '客户与业务', n: '跟进记录', i: 'clipboard', run: function () { App.showSubPage('trace-list'); } },
    { g: '客户与业务', n: '订单（我申请的）', i: 'package', run: function () { App.showSubPage('order-my'); } },
    { g: '客户与业务', n: '订单（我处理的）', i: 'wrench', run: function () { App.showSubPage('order-handle'); } },
    { g: '客户与业务', n: '平台订单', i: 'shopping-cart', run: function () { App.showSubPage('platform-order'); } },
    { g: '客户与业务', n: '样本管理', i: 'droplets', run: function () { App.showSubPage('sample'); } },
    { g: '客户与业务', n: '校展管理', i: 'graduation-cap', run: function () { App.showSubPage('school'); } },
    { g: '客户与业务', n: '售后管理', i: 'headphones', run: function () { App.showSubPage('after'); } },
    { g: '客户与业务', n: '新增客户', i: 'user-plus', run: function () { App.showSubPage('customer-add'); } },
    { g: '客户与业务', n: '发起审批', i: 'clipboard-check', run: function () { App.openApproveType(); } }
  ];
  window.OA_MODULES = MODULES;

  var sp = document.getElementById('boot-splash');
  function hideSplash() { if (sp) sp.style.display = 'none'; }
  function recordErr(tag, e) {
    try { localStorage.setItem('uping_boot_err', JSON.stringify({ t: Date.now(), tag: tag, m: String((e && e.message) || e || 'unknown'), s: String((e && e.stack) || '').slice(0, 260) })); } catch (_e) {}
  }
  window.addEventListener('error', function (ev) { recordErr('运行时错误', ev.error || ev.message); });
  window.addEventListener('unhandledrejection', function (ev) { recordErr('异步异常', ev.reason); });

  /* ===== 桌面侧栏（由模块清单生成，分组） ===== */
  function buildSidebar() {
    var nav = document.getElementById('sb-nav');
    if (!nav) return;
    var html = '', lastG = '';
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i];
      if (m.g !== lastG) { html += '<div class="sb-group">' + m.g + '</div>'; lastG = m.g; }
      var handler = (m.run ? 'App.__run(' + i + ')' : '');
      html += '<div class="sb-item" data-page="' + escAttr(m.n) + '" onclick="' + handler + '"><span class="sbi-icon" data-icon="' + m.i + '"></span>' + m.n + '</div>';
    }
    nav.innerHTML = html;
  }
  function escAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
  App.__run = function (i) { if (MODULES[i] && MODULES[i].run) MODULES[i].run(); };

  /* ===== 桌面命令面板（Ctrl+K） ===== */
  var cmdkMask = document.getElementById('cmdk-mask');
  var cmdkInput = document.getElementById('cmdk-input');
  var cmdkList = document.getElementById('cmdk-list');
  var cmdkSel = 0, cmdkHits = [];
  function cmdkRender(kw) {
    cmdkHits = []; cmdkList.innerHTML = '';
    kw = (kw || '').replace(/^\s+|\s+$/g, '').toLowerCase();
    var html = '', lastG = '', idx = 0;
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i];
      if (kw && m.n.toLowerCase().indexOf(kw) < 0 && m.g.toLowerCase().indexOf(kw) < 0) continue;
      if (m.g !== lastG) { html += '<div class="cmdk-group">' + m.g + '</div>'; lastG = m.g; }
      cmdkHits.push(m);
      html += '<div class="cmdk-item' + (idx === 0 ? ' sel' : '') + '" data-k="' + idx + '">' +
        '<div class="ci-ic">' + svg(m.i) + '</div><div class="ci-name">' + m.n + '</div><div class="ci-hint">打开</div></div>';
      idx++;
    }
    if (!idx) html = '<div class="cmdk-empty">没有匹配的模块</div>';
    cmdkList.innerHTML = html; cmdkSel = 0;
    var items = cmdkList.querySelectorAll('.cmdk-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function () { cmdkGo(parseInt(this.getAttribute('data-k'), 10)); });
      items[j].addEventListener('mousemove', function () { var k = parseInt(this.getAttribute('data-k'), 10); if (k !== cmdkSel) { cmdkSel = k; cmdkSyncSel(); } });
    }
  }
  function cmdkSyncSel() {
    var items = cmdkList.querySelectorAll('.cmdk-item');
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('sel', i === cmdkSel);
    var sel = items[cmdkSel]; if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
  function cmdkGo(k) { var m = cmdkHits[k]; cmdkClose(); if (m && m.run) m.run(); }
  function cmdkOpen() { cmdkMask.classList.add('open'); cmdkInput.value = ''; cmdkRender(''); setTimeout(function () { cmdkInput.focus(); }, 60); }
  function cmdkClose() { cmdkMask.classList.remove('open'); }
  if (cmdkInput) {
    cmdkInput.addEventListener('input', function () { cmdkRender(cmdkInput.value); });
    cmdkInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowDown') { ev.preventDefault(); if (cmdkHits.length) { cmdkSel = (cmdkSel + 1) % cmdkHits.length; cmdkSyncSel(); } }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); if (cmdkHits.length) { cmdkSel = (cmdkSel - 1 + cmdkHits.length) % cmdkHits.length; cmdkSyncSel(); } }
      else if (ev.key === 'Enter') { ev.preventDefault(); cmdkGo(cmdkSel); }
      else if (ev.key === 'Escape') { cmdkClose(); }
    });
  }
  if (cmdkMask) cmdkMask.addEventListener('click', function (ev) { if (ev.target === cmdkMask) cmdkClose(); });
  document.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); if (cmdkMask.classList.contains('open')) cmdkClose(); else cmdkOpen(); }
    else if (ev.key === 'Escape' && cmdkMask.classList.contains('open')) cmdkClose();
  });
  var sTrigger = document.getElementById('search-trigger');
  if (sTrigger) sTrigger.addEventListener('click', cmdkOpen);

  /* ===== 桌面侧栏高亮 + 面包屑 + 用户菜单 ===== */
  var TABS = { home: '工作台', approve: '审批中心', customer: '客户管理', mine: '个人中心' };
  function syncSidebarPage(key) {
    var items = document.querySelectorAll('.sb-item[data-page]');
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', items[i].getAttribute('data-page') === key);
  }
  function setCrumb(c1) {
    var crumb = document.getElementById('topbar-crumb'), c1el = document.getElementById('crumb-1');
    if (!crumb || !c1el) return;
    if (c1) { c1el.textContent = c1; crumb.style.display = 'flex'; } else crumb.style.display = 'none';
  }
  function wrapNav() {
    if (!window.App) return;
    var _sub = App.showSubPage, _tab = App.switchTab;
    App.showSubPage = function (type) { _sub(type); syncSidebarPage(type); setCrumb(TABS[currentTabName()] || ''); };
    App.switchTab = function (tab) { _tab(tab); syncSidebarPage(''); setCrumb(''); };
  }
  function currentTabName() { try { if (window.App && App.currentTab) return App.currentTab; } catch (e) {} return 'home'; }
  function fillUser() {
    var n = '用户';
    try { if (window.App && typeof App.myDisplayName === 'function') { var x = App.myDisplayName(); if (x) n = String(x); } } catch (e) {}
    try { var u = JSON.parse(localStorage.getItem('uping_saved_user') || 'null'); if (u && u.u) n = String(u.u); } catch (e) {}
    var ava = n ? n.charAt(0).toUpperCase() : 'U';
    ['sb-user-name', 'topbar-user-name'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = n; });
    ['sb-user-ava', 'topbar-user-ava'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = ava; });
    return n;
  }
  function bindUserMenu() {
    var trigger = document.getElementById('topbar-user'), menu = document.getElementById('user-menu');
    if (!trigger || !menu) return;
    trigger.addEventListener('click', function (ev) { ev.stopPropagation(); var r = trigger.getBoundingClientRect(); menu.style.top = (r.bottom + 6) + 'px'; menu.style.right = Math.max(12, window.innerWidth - r.right) + 'px'; menu.classList.toggle('open'); });
    document.addEventListener('click', function () { menu.classList.remove('open'); });
    menu.addEventListener('click', function (ev) { ev.stopPropagation(); menu.classList.remove('open'); });
  }

  /* ===== 手机导航：底部 Tab + App Bar 搜索/通知 + 标题同步 ===== */
  function bindMobile() {
    var tabs = document.querySelectorAll('#m-tabbar .m-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () {
        var t = this.getAttribute('data-tab');
        if (t === 'message-inbox') App.showSubPage('message-inbox'); else App.switchTab(t);
      });
    }
    var ms = document.getElementById('m-search');
    if (ms) ms.addEventListener('click', openMobileSearch);
    var mb = document.getElementById('m-bell');
    if (mb) mb.addEventListener('click', function () { App.showSubPage('message-inbox'); });
    var ssInput = document.getElementById('m-ss-input');
    if (ssInput) ssInput.addEventListener('input', function () { renderMobileSearch(ssInput.value); });
    var ssCancel = document.getElementById('m-ss-cancel');
    if (ssCancel) ssCancel.addEventListener('click', closeMobileSearch);
    var sheet = document.getElementById('m-search-sheet');
    if (sheet) sheet.addEventListener('click', function (ev) { if (ev.target === sheet) closeMobileSearch(); });
    // 包装 showSubPage：同步底部 Tab 高亮
    var _sub = App.showSubPage;
    App.showSubPage = function (type) {
      _sub(type);
      var map = { 'message-inbox': 'message-inbox', 'message-sendbox': 'message-inbox', 'message-draft': 'message-inbox', 'message-rubbish': 'message-inbox', 'customer': 'customer', 'customer-add': 'customer', 'contact-list': 'customer', 'chance-list': 'customer', 'trace-list': 'customer', 'order-my': 'customer', 'order-handle': 'customer', 'mine': 'mine', 'profile': 'mine', 'password': 'mine' };
      syncMobileTabs(map[type] || null);
    };
    var _tab = App.switchTab;
    App.switchTab = (function (orig) { return function (tab) { orig(tab); syncMobileTabs(tab); }; })(_tab);
  }
  function syncMobileTabs(active) {
    var tabs = document.querySelectorAll('#m-tabbar .m-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === active);
  }
  function openMobileSearch() {
    renderMobileSearch('');
    var s = document.getElementById('m-search-sheet'); if (s) s.classList.add('open');
    var inp = document.getElementById('m-ss-input'); if (inp) setTimeout(function () { inp.focus(); }, 80);
  }
  function closeMobileSearch() { var s = document.getElementById('m-search-sheet'); if (s) s.classList.remove('open'); }
  function renderMobileSearch(kw) {
    var list = document.getElementById('m-ss-list'); if (!list) return;
    kw = (kw || '').replace(/^\s+|\s+$/g, '').toLowerCase();
    var html = '', lastG = '', idx = 0;
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i];
      if (kw && m.n.toLowerCase().indexOf(kw) < 0 && m.g.toLowerCase().indexOf(kw) < 0) continue;
      if (m.g !== lastG) { html += '<div class="m-ss-group">' + m.g + '</div>'; lastG = m.g; }
      html += '<div class="m-ss-item" data-k="' + idx + '"><div class="m-ss-ic">' + svg(m.i) + '</div><div>' + m.n + '</div></div>';
      idx++;
    }
    if (!idx) html = '<div class="m-ss-empty">没有匹配的模块</div>';
    list.innerHTML = html;
    var items = list.querySelectorAll('.m-ss-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function () { var k = parseInt(this.getAttribute('data-k'), 10); if (MODULES[k] && MODULES[k].run) { closeMobileSearch(); MODULES[k].run(); } });
    }
  }
  function syncBellBadge(n) {
    n = n || 0;
    var d = document.getElementById('bell-badge'), m = document.getElementById('m-bell-badge');
    if (d) { if (n > 0) { d.style.display = 'inline-block'; d.textContent = n > 99 ? '99+' : n; } else d.style.display = 'none'; }
    if (m) { if (n > 0) { m.style.display = 'inline-block'; m.textContent = n > 99 ? '99+' : n; } else m.style.display = 'none'; }
  }
  window.OA_SYNC_BELL = syncBellBadge;

  /* ===== 移动端 App Bar 标题/返回 与桌面壳同步 =====
     app.js 只写桌面 #topbar-title（DOM 中第一个），并把返回按钮插入隐藏的
     .topbar-left；此处用观察者把标题镜像到 .m-title、按 #topbar-back-el 存在与否
     显隐 #m-back（点击统一走 App.detailBack，兼容子页面与详情页返回）。 */
  function bindMobileChrome() {
    var mTitle = document.getElementById('m-title');
    var mBack = document.getElementById('m-back');
    var dTitle = document.getElementById('topbar-title');
    function syncTitle() { if (mTitle && dTitle) mTitle.textContent = dTitle.textContent; }
    if (dTitle && window.MutationObserver) {
      new MutationObserver(syncTitle).observe(dTitle, { childList: true, characterData: true, subtree: true });
    }
    syncTitle();
    function syncBack() {
      var has = !!document.getElementById('topbar-back-el');
      if (mBack) mBack.hidden = !has;
    }
    var av = document.getElementById('app-view');
    if (av && window.MutationObserver) new MutationObserver(syncBack).observe(av, { childList: true, subtree: true });
    syncBack();
    if (mBack) mBack.addEventListener('click', function () { try { if (window.App && App.detailBack) App.detailBack(); } catch (e) {} });
  }

  /* ===== 启动 ===== */
  function boot() {
    try {
      paintIcons(document);
      buildSidebar();
      bindMobileChrome();
      if (OA.isLoggedIn()) {
        document.getElementById('app-view').style.display = 'flex';
        App.init();
        wrapNav();
        fillUser();
        bindUserMenu();
        bindMobile();
        hideSplash();
      } else { location.replace('login.html'); }
    } catch (e) {
      recordErr('主界面启动异常', e);
      try { localStorage.removeItem('uping_user'); localStorage.removeItem('uping_me'); } catch (_e) {}
      location.replace('login.html');
    }
  }
  setTimeout(function () {
    if (!sp || sp.style.display === 'none') return;
    var logged = false;
    try { logged = localStorage.getItem('uping_user') === '1'; } catch (e) {}
    if (!logged) { recordErr('看门狗', '启动屏未消失且无登录态'); location.replace('login.html'); return; }
    hideSplash();
    var av = document.getElementById('app-view');
    if (av && av.style.display === 'none') {
      av.style.display = 'flex';
      try { paintIcons(document); buildSidebar(); bindMobileChrome(); App.init(); wrapNav(); fillUser(); bindUserMenu(); bindMobile(); } catch (e) { recordErr('看门狗重试', e); }
    }
  }, 3500);
  boot();
})();
</script>
